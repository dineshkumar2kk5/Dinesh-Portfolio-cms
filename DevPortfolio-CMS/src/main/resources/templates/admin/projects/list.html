<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">

<head><title th:text="${pageTitle}">Projects</title></head>

<body>
<main layout:fragment="content">

    <section class="admin-section">
        <div class="container py-5">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <span class="admin-badge"><i class="bi bi-folder me-1"></i> PROJECTS</span>
                    <h2 class="admin-title">Manage Projects</h2>
                </div>
                <a th:href="@{/admin/projects/new}" class="btn btn-primary-custom">
                    <i class="bi bi-plus-lg me-2"></i>Add Project
                </a>
            </div>

            <!-- Flash Messages -->
            <div th:if="${successMessage}" class="alert alert-success alert-custom d-flex align-items-center gap-2 animate-fade-in">
                <i class="bi bi-check-circle"></i><span th:text="${successMessage}">Success</span>
            </div>
            <div th:if="${errorMessage}" class="alert alert-danger alert-custom d-flex align-items-center gap-2 animate-fade-in">
                <i class="bi bi-exclamation-triangle"></i><span th:text="${errorMessage}">Error</span>
            </div>

            <!-- Projects Table -->
            <div class="admin-table-card">
                <div class="table-responsive">
                    <table class="table table-custom">
                        <thead>
                            <tr>
                                <th>Order</th>
                                <th>Image</th>
                                <th>Title</th>
                                <th>Tech Stack</th>
                                <th>Role</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="project : ${projects}">
                                <td><span class="badge bg-secondary" th:text="${project.displayOrder}">1</span></td>
                                <td>
                                    <img th:if="${project.imageUrl}" th:src="${project.imageUrl}"
                                         class="rounded" style="width:48px;height:48px;object-fit:cover;"/>
                                    <span th:unless="${project.imageUrl}" class="text-muted"><i class="bi bi-image"></i></span>
                                </td>
                                <td>
                                    <strong th:text="${project.title}">Project</strong>
                                    <br/><small class="text-muted" th:text="${project.subtitle}">Subtitle</small>
                                </td>
                                <td>
                                    <span th:each="tag : ${project.techTags}" th:if="${#lists.size(project.techTags) > 0}"
                                          class="tech-badge-sm me-1 mb-1" th:text="${tag}">Tag</span>
                                </td>
                                <td th:text="${project.role}">Role</td>
                                <td>
                                    <div class="d-flex gap-1">
                                        <a th:href="@{/projects/{id}(id=${project.id})}" target="_blank"
                                           class="btn btn-sm btn-outline-info" title="Preview">
                                            <i class="bi bi-eye"></i>
                                        </a>
                                        <a th:href="@{/admin/projects/edit/{id}(id=${project.id})}"
                                           class="btn btn-sm btn-outline-warning" title="Edit">
                                            <i class="bi bi-pencil"></i>
                                        </a>
                                        <form th:action="@{/admin/projects/delete/{id}(id=${project.id})}"
                                              method="post" class="d-inline"
                                              onsubmit="return confirm('Are you sure you want to delete this project?');">
                                            <button type="submit" class="btn btn-sm btn-outline-danger" title="Delete">
                                                <i class="bi bi-trash"></i>
                                            </button>
                                        </form>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <div th:if="${#lists.isEmpty(projects)}" class="text-center py-5">
                    <i class="bi bi-folder-x fs-1 text-muted"></i>
                    <p class="text-muted mt-3">No projects found. Add your first project!</p>
                </div>
            </div>

            <a th:href="@{/admin/dashboard}" class="btn btn-outline-custom mt-3">
                <i class="bi bi-arrow-left me-2"></i>Back to Dashboard
            </a>
        </div>
    </section>

</main>
</body>
</html>

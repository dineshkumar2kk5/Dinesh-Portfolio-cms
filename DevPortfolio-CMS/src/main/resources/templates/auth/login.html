<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">

<head><title th:text="${pageTitle}">Login</title></head>

<body>
<main layout:fragment="content">

    <section class="auth-section">
        <div class="container d-flex justify-content-center align-items-center min-vh-75">
            <div class="auth-card">
                <!-- Header -->
                <div class="auth-header text-center">
                    <div class="auth-icon-circle mb-3">
                        <i class="bi bi-shield-lock fs-3"></i>
                    </div>
                    <h2 class="auth-title">Admin Login</h2>
                    <p class="auth-subtitle">Sign in to access the CMS dashboard</p>
                </div>

                <!-- Alerts -->
                <div th:if="${errorMessage}" class="alert alert-danger alert-custom d-flex align-items-center gap-2" role="alert">
                    <i class="bi bi-exclamation-triangle"></i>
                    <span th:text="${errorMessage}">Error</span>
                </div>
                <div th:if="${successMessage}" class="alert alert-success alert-custom d-flex align-items-center gap-2" role="alert">
                    <i class="bi bi-check-circle"></i>
                    <span th:text="${successMessage}">Success</span>
                </div>

                <!-- Login Form -->
                <form th:action="@{/auth/login}" method="post" class="auth-form">
                    <div class="mb-3">
                        <label for="username" class="form-label-custom">Username</label>
                        <div class="input-group input-group-custom">
                            <span class="input-group-text"><i class="bi bi-person"></i></span>
                            <input type="text" id="username" name="username" class="form-control form-control-custom"
                                   placeholder="Enter your username" required autofocus/>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label for="password" class="form-label-custom">Password</label>
                        <div class="input-group input-group-custom">
                            <span class="input-group-text"><i class="bi bi-lock"></i></span>
                            <input type="password" id="password" name="password" class="form-control form-control-custom"
                                   placeholder="Enter your password" required/>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary-custom w-100 py-2">
                        <i class="bi bi-box-arrow-in-right me-2"></i>Sign In
                    </button>
                </form>


            </div>
        </div>
    </section>

</main>
</body>
</html>

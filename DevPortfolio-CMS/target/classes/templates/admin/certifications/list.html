<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">

<head><title th:text="${pageTitle}">Certifications</title></head>

<body>
<main layout:fragment="content">

    <section class="admin-section">
        <div class="container py-5">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <span class="admin-badge"><i class="bi bi-award me-1"></i> CERTIFICATIONS</span>
                    <h2 class="admin-title">Manage Certifications</h2>
                </div>
                <a th:href="@{/admin/certifications/new}" class="btn btn-primary-custom">
                    <i class="bi bi-plus-lg me-2"></i>Add Certification
                </a>
            </div>

            <!-- Flash Messages -->
            <div th:if="${successMessage}" class="alert alert-success alert-custom d-flex align-items-center gap-2 animate-fade-in">
                <i class="bi bi-check-circle"></i><span th:text="${successMessage}">Success</span>
            </div>
            <div th:if="${errorMessage}" class="alert alert-danger alert-custom d-flex align-items-center gap-2 animate-fade-in">
                <i class="bi bi-exclamation-triangle"></i><span th:text="${errorMessage}">Error</span>
            </div>

            <!-- Certifications Table -->
            <div class="admin-table-card">
                <div class="table-responsive">
                    <table class="table table-custom">
                        <thead>
                            <tr>
                                <th>Order</th>
                                <th>Image</th>
                                <th>Name</th>
                                <th>Issuer</th>
                                <th>Year</th>
                                <th>Credential ID</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="cert : ${certifications}">
                                <td><span class="badge bg-secondary" th:text="${cert.displayOrder}">1</span></td>
                                <td>
                                    <div th:if="${cert.certificateImage != null}">
                                        <img th:src="${cert.certificateImage}" class="rounded" style="width:40px; height:40px; object-fit:cover; border:1px solid rgba(255,255,255,0.1);"/>
                                    </div>
                                    <div th:if="${cert.certificateImage == null}" class="text-muted small">
                                        <i class="bi bi-award fs-5"></i>
                                    </div>
                                </td>
                                <td>
                                    <strong th:text="${cert.name}">Certification Name</strong>
                                </td>
                                <td th:text="${cert.issuer}">Issuer</td>
                                <td th:text="${cert.year}">2025</td>
                                <td><code th:text="${cert.credentialId}">ID</code></td>
                                <td>
                                    <div class="d-flex gap-1">
                                        <a th:href="@{/admin/certifications/edit/{id}(id=${cert.id})}"
                                           class="btn btn-sm btn-outline-warning" title="Edit">
                                            <i class="bi bi-pencil"></i>
                                        </a>
                                        <form th:action="@{/admin/certifications/delete/{id}(id=${cert.id})}"
                                              method="post" class="d-inline"
                                              onsubmit="return confirm('Are you sure you want to delete this certification?');">
                                            <button type="submit" class="btn btn-sm btn-outline-danger" title="Delete">
                                                <i class="bi bi-trash"></i>
                                            </button>
                                        </form>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <div th:if="${#lists.isEmpty(certifications)}" class="text-center py-5">
                    <i class="bi bi-award fs-1 text-muted"></i>
                    <p class="text-muted mt-3">No certifications found. Add your first certification!</p>
                </div>
            </div>

            <a th:href="@{/admin/dashboard}" class="btn btn-outline-custom mt-3">
                <i class="bi bi-arrow-left me-2"></i>Back to Dashboard
            </a>
        </div>
    </section>

</main>
</body>
</html>

# ================================
# DevPortfolio CMS - Configuration
# ================================

spring.application.name=DevPortfolio-CMS
server.port=8080

# MongoDB Configuration
# Using embedded MongoDB (flapdoodle) for zero-setup development.
# To use an external MongoDB, uncomment the line below and remove the embedded dependency from pom.xml:
# spring.data.mongodb.uri=mongodb://localhost:27017/devportfolio_db
de.flapdoodle.mongodb.embedded.version=7.0.9
spring.data.mongodb.auto-index-creation=true

# Thymeleaf Configuration
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# File Upload Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Custom upload directory (relative to project root)
app.upload.dir=uploads

# Default admin credentials (used by DataInitializer on first run)
app.admin.username=dinesh
app.admin.password=dinesh09#
app.admin.email=dineshkumar2kk5@gmail.com

# Logging
logging.level.org.springframework.security=INFO
logging.level.com.dinesh.portfolio=DEBUG
